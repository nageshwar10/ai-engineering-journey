
name: Python Code Quality

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-quality:
    name: Python Syntax & Lint Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Discover Python Files
        id: discover
        run: |
          FILE_COUNT=$(find Python -type f -name "*.py" | wc -l | tr -d ' ')

          echo "Found $FILE_COUNT Python files"

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "::error::No Python files found in Python directory"
            exit 1
          fi

          echo "file_count=$FILE_COUNT" >> "$GITHUB_OUTPUT"

      - name: Python Syntax Check
        id: syntax
        continue-on-error: true
        run: |
          echo "Checking Python syntax..."

          set +e
          python -m compileall -q -f Python > syntax-output.txt 2>&1
          RESULT=$?
          set -e

          cat syntax-output.txt

          if [ "$RESULT" -eq 0 ]; then
            echo "Syntax check passed."
          else
            echo "::error::Python syntax errors detected"
          fi

          exit "$RESULT"

      - name: Python Lint Check
        id: lint
        continue-on-error: true
        run: |
          echo "Running Ruff lint checks..."

          set +e
          ruff check Python --output-format=full > lint-output.txt 2>&1
          RESULT=$?
          set -e

          cat lint-output.txt

          if [ "$RESULT" -eq 0 ]; then
            echo "Lint check passed."
          elif [ "$RESULT" -eq 1 ]; then
            echo "::error::Python lint violations detected"
          else
            echo "::error::Ruff execution or configuration error"
          fi

          exit "$RESULT"

      - name: Generate Code Quality Summary
        if: always()
        env:
          SYNTAX_RESULT: ${{ steps.syntax.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          FILE_COUNT: ${{ steps.discover.outputs.file_count }}
        run: |
          {
            echo "# Python Code Quality Report"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Python files scanned | ${FILE_COUNT:-Not available} |"
            echo "| Syntax validation | ${SYNTAX_RESULT:-Not executed} |"
            echo "| Ruff lint | ${LINT_RESULT:-Not executed} |"
            echo ""

            echo "## Syntax Check Output"
            echo ""
            echo '```text'

            if [ -s syntax-output.txt ]; then
              cat syntax-output.txt
            else
              echo "No syntax errors found."
            fi

            echo '```'
            echo ""
            echo "## Ruff Lint Output"
            echo ""
            echo '```text'

            if [ -s lint-output.txt ]; then
              cat lint-output.txt
            else
              echo "No lint issues found."
            fi

            echo '```'
            echo ""

            if [ "$SYNTAX_RESULT" = "success" ] && \
               [ "$LINT_RESULT" = "success" ]; then
              echo "## Overall Result: PASSED"
            else
              echo "## Overall Result: FAILED"
            fi

          } >> "$GITHUB_STEP_SUMMARY"

      - name: Final Quality Gate
        if: always()
        env:
          SYNTAX_RESULT: ${{ steps.syntax.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
        run: |
          if [ "$SYNTAX_RESULT" != "success" ] || \
             [ "$LINT_RESULT" != "success" ]; then
            echo "::error::Python code quality checks failed."
            exit 1
          fi

          echo "All Python code quality checks passed!"
