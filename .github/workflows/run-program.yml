
name: Run Selected Program

on:
  workflow_dispatch:
    inputs:
      folder:
        description: "Select the folder"
        required: true
        type: choice
        options:
          - Python

      file:
        description: "Select the Python file"
        required: true
        type: choice
        options:
          - 01_variables.py
          - 02_operators.py
          - 03_lists.py
          - 04_tuples.py

permissions:
  contents: read

jobs:
  run-program:
    name: Execute Selected Program
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate selected program
        env:
          SELECTED_FOLDER: ${{ inputs.folder }}
          SELECTED_FILE: ${{ inputs.file }}
        run: |
          set -e

          case "$SELECTED_FOLDER/$SELECTED_FILE" in
            Python/01_variables.py|\
            Python/02_operators.py|\
            Python/03_lists.py|\
            Python/04_tuples.py)
              echo "Program selection is valid."
              ;;
            *)
              echo "::error::Invalid program selection."
              exit 1
              ;;
          esac

          if [ ! -f "$SELECTED_FOLDER/$SELECTED_FILE" ]; then
            echo "::error::Selected file does not exist."
            exit 1
          fi

      - name: Execute Python Program
        id: execute
        env:
          SELECTED_FOLDER: ${{ inputs.folder }}
          SELECTED_FILE: ${{ inputs.file }}
        run: |
          echo "=================================================="
          echo "             PYTHON PROGRAM EXECUTION"
          echo "=================================================="

          echo "Folder  : $SELECTED_FOLDER"
          echo "File    : $SELECTED_FILE"
          echo "Python  : $(python --version)"
          echo "Runner  : ubuntu-latest"

          echo ""
          echo "--------------- PROGRAM OUTPUT ------------------"
          echo ""

          set +e
          python -u "$SELECTED_FOLDER/$SELECTED_FILE" 2>&1 | tee program-output.txt
          PROGRAM_EXIT_CODE=${PIPESTATUS[0]}
          set -e

          echo "PROGRAM_EXIT_CODE=$PROGRAM_EXIT_CODE" >> "$GITHUB_ENV"

          echo ""
          echo "--------------------------------------------------"

          if [ "$PROGRAM_EXIT_CODE" -eq 0 ]; then
            echo "Execution Status: SUCCESS"
          else
            echo "::error::Program failed with exit code $PROGRAM_EXIT_CODE"
            echo "Execution Status: FAILED"
          fi

          exit "$PROGRAM_EXIT_CODE"

      - name: Publish Execution Summary
        if: always()
        env:
          SELECTED_FOLDER: ${{ inputs.folder }}
          SELECTED_FILE: ${{ inputs.file }}
        run: |
          {
            echo "# Python Program Execution"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Folder | \`$SELECTED_FOLDER\` |"
            echo "| File | \`$SELECTED_FILE\` |"
            echo "| Runner | ubuntu-latest |"
            echo "| Python | 3.12 |"
            echo ""

            if [ "${PROGRAM_EXIT_CODE:-not-run}" = "0" ]; then
              echo "## Execution Status: SUCCESS"
            elif [ "${PROGRAM_EXIT_CODE:-not-run}" = "not-run" ]; then
              echo "## Execution Status: NOT EXECUTED"
            else
              echo "## Execution Status: FAILED"
              echo ""
              echo "Exit code: \`$PROGRAM_EXIT_CODE\`"
            fi

            echo ""
            echo "## Program Output"
            echo ""
            echo "<details open>"
            echo "<summary>View Python execution output</summary>"
            echo ""
            echo '```text'

            if [ -f program-output.txt ]; then
              head -c 50000 program-output.txt
              echo ""
            else
              echo "No program output was captured."
            fi

            echo '```'
            echo ""
            echo "</details>"

          } >> "$GITHUB_STEP_SUMMARY"
