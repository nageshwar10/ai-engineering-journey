
name: Python URL Shortener CI

on:
  push:
    branches:
      - main
    paths:
      - "python-project/url-shortener/**"
      - ".github/workflows/python-url-shortener-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "python-project/url-shortener/**"
      - ".github/workflows/python-url-shortener-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # -----------------------------------------------
  # Job 1: Run automated tests
  # -----------------------------------------------
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ vars.MYSQL_DATABASE }}
          MYSQL_USER: ${{ vars.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: python-project/url-shortener

    env:
      MYSQL_HOST: ${{ vars.MYSQL_HOST }}
      MYSQL_PORT: ${{ vars.MYSQL_PORT }}
      MYSQL_DATABASE: ${{ vars.MYSQL_DATABASE }}
      MYSQL_USER: ${{ vars.MYSQL_USER }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}

      DATABASE_URL: mysql+pymysql://${{ vars.MYSQL_USER }}:${{ secrets.MYSQL_PASSWORD }}@${{ vars.MYSQL_HOST }}:${{ vars.MYSQL_PORT }}/${{ vars.MYSQL_DATABASE }}

      BASE_URL: ${{ vars.BASE_URL }}
      CODE_LENGTH: ${{ vars.CODE_LENGTH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python-project/url-shortener/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest -v


  # -----------------------------------------------
  # Job 2: Build and push Docker image
  # -----------------------------------------------
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    needs: test

    # Publish only after successful tests on main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./python-project/url-shortener
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/url-shortener:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/url-shortener:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
